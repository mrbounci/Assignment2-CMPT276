<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Ratings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Staff Ratings</h1>
        <form action="/create.html" method="get">
        <button type="submit">Create a Review</button>

        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Clarity</th>
                    <th>Niceness</th>
                    <th>Knowledge</th>
                    <th>Comment</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r:${rate}">
                    <td th:text="${r.uid}"></td>
                    <td th:text="${r.name}"></td>
                    <td th:text="${r.email}"></td>
                    <td th:text="${r.roleType}"></td>
                    <td th:text="${r.clarity}"></td>
                    <td th:text="${r.niceness}"></td>
                    <td th:text="${r.knowledgeableScore}"></td>
                    <td th:text="${r.comment}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</form>
</body>
</html>
