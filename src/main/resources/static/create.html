<!DOCTYPE html>
<html>
<body>
<form action="/StaffRating/create" method="post">
    Name: <input name="name"><br>
    Email: <input name="email"><br>
    Role: <select name="roleType">
        <option>TA</option>
        <option>PROF</option>
    </select><br>
    Clarity: <input name="clarity" type="number"><br>
    Niceness: <input name="niceness" type="number"><br>
    Knowledge: <input name="knowledgeableScore" type="number"><br>
    Comment: <input name="comment"><br>
    <button type="submit">Submit</button>
</form>
</body>
</html>
